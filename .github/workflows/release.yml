name: Build & Release StemTool

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.10.0)'
        required: true
        default: '0.10.0'
      publish_release:
        description: 'Publish GitHub Release with all installers'
        required: true
        type: boolean
        default: true
      draft:
        description: 'Mark release as Draft'
        required: true
        type: boolean
        default: false
      prerelease:
        description: 'Mark release as Pre-release'
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # =========================================================================
  # 1. BUILD WINDOWS INSTALLERS (.exe setup + .zip portable)
  # =========================================================================
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set version
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver -and "${{ github.ref }}" -like "refs/tags/v*") {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          if (-not $ver) {
            $ver = (node -p "require('./package.json').version").Trim()
          }
          if (-not $ver) { $ver = "0.10.0" }
          Write-Host "Configuring StemTool version: $ver"
          npm version $ver --no-git-tag-version --allow-same-version

      - name: Cache FFmpeg (Windows)
        uses: actions/cache@v4
        with:
          path: extras/ffmpeg-win
          key: ffmpeg-win-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-ffmpeg.ps1

      - name: Build Windows Installers
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  # =========================================================================
  # 2. BUILD MACOS INSTALLERS (.dmg + .zip)
  # =========================================================================
  build-macos:
    name: Build macOS
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VER" ]; then
            VER=$(node -p "require('./package.json').version")
          fi
          if [ -z "$VER" ]; then VER="0.10.0"; fi
          echo "Configuring StemTool version: $VER"
          npm version "$VER" --no-git-tag-version --allow-same-version

      - name: Install build tools (macOS)
        run: |
          brew install pkg-config nasm

      - name: Cache FFmpeg (macOS)
        uses: actions/cache@v4
        with:
          path: extras/ffmpeg-mac
          key: ffmpeg-mac-${{ hashFiles('scripts/fetch-ffmpeg.sh') }}

      - name: Fetch FFmpeg
        run: bash scripts/fetch-ffmpeg.sh

      - name: Build macOS DMG & Zip
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          STEMTOOL_ADHOC_SIGN: '1'

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  # =========================================================================
  # 3. BUILD LINUX INSTALLERS (.AppImage + .deb)
  # =========================================================================
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools fakeroot dpkg

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set version
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VER" ]; then
            VER=$(node -p "require('./package.json').version")
          fi
          if [ -z "$VER" ]; then VER="0.10.0"; fi
          echo "Configuring StemTool version: $VER"
          npm version "$VER" --no-git-tag-version --allow-same-version

      - name: Cache FFmpeg (Linux)
        uses: actions/cache@v4
        with:
          path: extras/ffmpeg-linux
          key: ffmpeg-linux-${{ hashFiles('scripts/fetch-ffmpeg.sh') }}

      - name: Fetch FFmpeg
        run: bash scripts/fetch-ffmpeg.sh

      - name: Build Linux AppImage & deb
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            release/*.AppImage
            release/*.deb
            release/latest-linux.yml
          if-no-files-found: error

  # =========================================================================
  # 4. PACKAGE PREMIERE PRO CEP PLUGIN
  # =========================================================================
  package-premiere-plugin:
    name: Package Premiere Pro Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Plugin Archive
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VER" ]; then
            VER=$(node -p "require('./package.json').version")
          fi
          if [ -z "$VER" ]; then VER="0.10.0"; fi

          mkdir -p dist-plugin
          PLUGIN_ZIP="dist-plugin/StemTool-Premiere-Plugin-v${VER}.zip"

          echo "Archiving Premiere Pro Plugin into $PLUGIN_ZIP..."
          (cd premiere-plugin && zip -r "../$PLUGIN_ZIP" . -x "*.git*")

      - name: Upload Premiere Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: premiere-plugin-installer
          path: dist-plugin/*.zip
          if-no-files-found: error

  # =========================================================================
  # 5. PUBLISH GITHUB RELEASE
  # =========================================================================
  publish-release:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux, package-premiere-plugin]
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag & Version
        id: vars
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VER" ]; then
            VER=$(node -p "require('./package.json').version")
          fi
          if [ -z "$VER" ]; then VER="0.10.0"; fi
          TAG="v${VER}"
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: |
          echo "Collected release assets:"
          ls -la release-assets/

      - name: Generate Release Notes
        id: notes
        run: |
          cat << 'EOF' > release_notes.md
          # StemTool v__VERSION__

          **StemTool** is a modern, high-performance, 100% local audio stem separation suite for music producers, sound designers, DJs, video editors, and audio creators.

          ---

          ### 🌟 What's New in v__VERSION__

          #### 1. 🔒 100% Local & Offline Architecture
          - **On-Device Audio Processing**: All audio stems are extracted entirely on your local machine using PyTorch runtimes without sending any data over the network.
          - **Completely Standalone**: Runs independently and offline with zero cloud server dependencies.

          #### 2. ⚡ High-Accuracy Neural Separation Models
          - **Demucs v4 (Hybrid Transformer)**: 4-stem isolation separating audio tracks into **Vocals**, **Drums**, **Bass**, and **Other**.
          - **Mel-Band Roformer**: State-of-the-art frequency-domain transformer delivering crisp vocal isolation and minimal bleed.
          - **Hardware Acceleration**: Automatic hardware acceleration on Apple Silicon (MPS / Metal Performance Shaders), NVIDIA GPUs (CUDA), and multi-threaded CPU fallback.

          #### 3. 🎛️ Audiophile Audio Resampling Pipeline
          - **Integrated SoX Resampler (`libsoxr`)**: Custom bundled 44.1 kHz resampler providing 28-bit HQ audio resampling without phase distortion or aliasing.
          - **Flexible Formats**: Import WAV, MP3, FLAC, M4A/AAC, OGG, or AIFF. Export as uncompressed 24-bit PCM WAV or high-bitrate AAC (256 kbps).

          #### 4. 🎬 Adobe Premiere Pro Extension Plugin (CEP)
          - **Direct Timeline Integration**: Select any audio clip on sequence track `A1` and split it directly onto tracks `A2` through `A5` with automated timeline synchronization.
          - **Decoupled Architecture**: Lightweight panel communicates with the background StemTool service without degrading Premiere Pro timeline playback.
          - **Automated Installers**: Includes 1-click installation scripts (`install-plugin.ps1` for Windows, `install-plugin.sh` for macOS).

          #### 5. 🎨 Modernized User Interface
          - **Interactive Stem Mixer**: Real-time per-stem volume faders, stereo panning knobs, mute, and solo controls.
          - **Visual Waveform Canvas**: Interactive waveform display with scrubbing and preview playback.
          - **Acoustic Refraction Prism Branding**: Clean, modern app identity with updated vector assets.

          ---

          ### 📦 Download Packages

          | Platform | Package File | Type | Architecture |
          | :--- | :--- | :--- | :--- |
          | **Windows** | `StemTool-__VERSION__-win-x64.exe` | NSIS Setup Installer | Windows 10/11 (x64) |
          | **Windows** | `StemTool-__VERSION__-win-x64.zip` | Portable Zip | Windows (x64) |
          | **macOS** | `StemTool-__VERSION__.dmg` | Disk Image (Universal) | Apple Silicon (M1–M4) & Intel (x86_64) |
          | **macOS** | `StemTool-__VERSION__-mac.zip` | Portable Zip | Apple Silicon & Intel (Universal) |
          | **Linux** | `StemTool-__VERSION__-linux-x86_64.AppImage` | Standalone AppImage | Linux (x86_64) |
          | **Linux** | `StemTool___VERSION___amd64.deb` | Debian / Ubuntu Package | Linux (x86_64) |
          | **Premiere Pro** | `StemTool-Premiere-Plugin-v__VERSION__.zip` | Extension Archive | Cross-platform CEP extension |

          ---

          ### 🚀 Quick Start Guide

          #### Desktop App
          1. Download the package for your OS above.
          2. Install or extract the application and launch **StemTool**.
          3. Drag & drop an audio file, choose your separation model, and click **Separate**.

          #### Premiere Pro Plugin
          1. Download `StemTool-Premiere-Plugin-v__VERSION__.zip` and unzip it.
          2. Run `install-plugin.ps1` (PowerShell on Windows) or `bash install-plugin.sh` (macOS).
          3. Launch Premiere Pro, open **Window > Extensions > StemTool**, and split any clip on your timeline.
          EOF
          sed -i "s/__VERSION__/${{ steps.vars.outputs.version }}/g" release_notes.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "StemTool v${{ steps.vars.outputs.version }}"
          body_path: release_notes.md
          draft: ${{ github.event.inputs.draft == 'true' || github.event.inputs.draft == true }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || github.event.inputs.prerelease == true }}
          make_latest: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
