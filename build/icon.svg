<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Canvas: Deep Matte Obsidian with subtle cosmic studio depth -->
    <linearGradient id="bg" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14131D"/>
      <stop offset="55%" stop-color="#0B0A11"/>
      <stop offset="100%" stop-color="#050408"/>
    </linearGradient>

    <!-- Radial ambient focal glow behind prism -->
    <radialGradient id="center_glow" cx="460" cy="512" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#2563EB" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Chamfer Inset Sheen -->
    <linearGradient id="bevel_sheen" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Prism Glass Facet Shading -->
    <linearGradient id="prism_left" x1="330" y1="500" x2="470" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="prism_right" x1="470" y1="500" x2="590" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="prism_edge" x1="470" y1="280" x2="470" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.4"/>
    </linearGradient>

    <!-- 1. Vocals Stem Gradient (Purple / Violet) -->
    <linearGradient id="stem_vocal_grad" x1="450" y1="0" x2="890" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="30%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- 2. Drums Stem Gradient (Coral / Vermilion) -->
    <linearGradient id="stem_drum_grad" x1="450" y1="0" x2="890" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE4E6"/>
      <stop offset="30%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>

    <!-- 3. Bass Stem Gradient (Amber / Warm Gold) -->
    <linearGradient id="stem_bass_grad" x1="450" y1="0" x2="890" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="30%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- 4. Other/Instruments Stem Gradient (Teal / Emerald) -->
    <linearGradient id="stem_other_grad" x1="450" y1="0" x2="890" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CCFBF1"/>
      <stop offset="30%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Prism & Rays -->
    <filter id="glow_subtle" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Base Squircle Canvas -->
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#center_glow)"/>

  <!-- Inset Border Highlights -->
  <rect x="2" y="2" width="1020" height="1020" rx="226" stroke="url(#bevel_sheen)" stroke-width="3"/>
  <rect x="14" y="14" width="996" height="996" rx="214" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1.5"/>

  <!-- Subtle Studio Axis & Calibration Marks -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-linecap="round">
    <line x1="120" y1="512" x2="904" y2="512" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="470" cy="512" r="260" stroke-width="1" stroke-dasharray="2 6"/>
  </g>

  <!-- 2. Incoming Unified Audio Wave (Mono Mix entering Prism from left) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Glow Wave -->
    <path d="M 120 512 L 180 512 Q 200 480 220 512 T 260 512 Q 280 440 300 512 T 340 512 Q 360 380 380 512 T 420 512 L 470 512"
          stroke="#A5B4FC" stroke-width="20" opacity="0.15" filter="url(#glow_subtle)"/>
    <!-- Core Pure White Wave -->
    <path d="M 120 512 L 180 512 Q 200 480 220 512 T 260 512 Q 280 440 300 512 T 340 512 Q 360 380 380 512 T 420 512 L 470 512"
          stroke="#FFFFFF" stroke-width="8" opacity="0.95"/>
    <circle cx="120" cy="512" r="5" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- 3. The 4 Refracted Stems (Exiting Prism into separated frequency tracks) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- STEM 1: Vocals (Purple / Violet - High harmonics) -->
    <!-- Glow -->
    <path d="M 470 512 C 540 512, 590 320, 670 320 Q 710 270, 750 320 T 830 320 L 890 320"
          stroke="#C084FC" stroke-width="22" opacity="0.18" filter="url(#glow_subtle)"/>
    <!-- Core Line -->
    <path d="M 470 512 C 540 512, 590 320, 670 320 Q 710 270, 750 320 T 830 320 L 890 320"
          stroke="url(#stem_vocal_grad)" stroke-width="8"/>
    <circle cx="890" cy="320" r="8" fill="#C084FC"/>
    <circle cx="890" cy="320" r="4" fill="#FFFFFF"/>

    <!-- STEM 2: Drums (Coral / Vermilion - Transient punch) -->
    <!-- Glow -->
    <path d="M 470 512 C 540 512, 590 440, 660 440 L 690 400 L 720 480 L 750 420 L 780 440 L 890 440"
          stroke="#FB7185" stroke-width="22" opacity="0.18" filter="url(#glow_subtle)"/>
    <!-- Core Line -->
    <path d="M 470 512 C 540 512, 590 440, 660 440 L 690 400 L 720 480 L 750 420 L 780 440 L 890 440"
          stroke="url(#stem_drum_grad)" stroke-width="8"/>
    <circle cx="890" cy="440" r="8" fill="#FB7185"/>
    <circle cx="890" cy="440" r="4" fill="#FFFFFF"/>

    <!-- STEM 3: Bass (Amber / Gold - Deep low sine) -->
    <!-- Glow -->
    <path d="M 470 512 C 540 512, 590 584, 660 584 Q 715 634, 770 584 T 880 584 L 890 584"
          stroke="#FBBF24" stroke-width="22" opacity="0.18" filter="url(#glow_subtle)"/>
    <!-- Core Line -->
    <path d="M 470 512 C 540 512, 590 584, 660 584 Q 715 634, 770 584 T 880 584 L 890 584"
          stroke="url(#stem_bass_grad)" stroke-width="8"/>
    <circle cx="890" cy="584" r="8" fill="#FBBF24"/>
    <circle cx="890" cy="584" r="4" fill="#FFFFFF"/>

    <!-- STEM 4: Other / Instruments (Teal / Emerald - Rich mids) -->
    <!-- Glow -->
    <path d="M 470 512 C 540 512, 590 704, 670 704 Q 705 744, 740 704 T 810 704 Q 840 680, 870 704 L 890 704"
          stroke="#2DD4BF" stroke-width="22" opacity="0.18" filter="url(#glow_subtle)"/>
    <!-- Core Line -->
    <path d="M 470 512 C 540 512, 590 704, 670 704 Q 705 744, 740 704 T 810 704 Q 840 680, 870 704 L 890 704"
          stroke="url(#stem_other_grad)" stroke-width="8"/>
    <circle cx="890" cy="704" r="8" fill="#2DD4BF"/>
    <circle cx="890" cy="704" r="4" fill="#FFFFFF"/>
  </g>

  <!-- 4. Central Geometric Acoustic Prism (The Separation Core) -->
  <g>
    <!-- Left Glass Facet -->
    <polygon points="470,268 334,696 470,640" fill="url(#prism_left)"/>
    <!-- Right Glass Facet -->
    <polygon points="470,268 606,696 470,640" fill="url(#prism_right)"/>

    <!-- Precision Edge Line Wireframe -->
    <polygon points="470,268 334,696 606,696"
             fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.25"/>

    <!-- Center Ridge (Apex down to interior focal nexus) -->
    <line x1="470" y1="268" x2="470" y2="640"
          stroke="url(#prism_edge)" stroke-width="3" stroke-linecap="round"/>

    <!-- Base Chamfer Line -->
    <line x1="334" y1="696" x2="470" y2="640" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2"/>
    <line x1="606" y1="696" x2="470" y2="640" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.2"/>
  </g>

  <!-- 5. Focal Nexus Point (The point of separation inside the prism) -->
  <g filter="url(#glow_subtle)">
    <circle cx="470" cy="512" r="22" fill="#FFFFFF" fill-opacity="0.12"/>
    <circle cx="470" cy="512" r="10" fill="#FFFFFF" fill-opacity="0.8"/>
    <circle cx="470" cy="512" r="4" fill="#FFFFFF"/>
  </g>
</svg>
